<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS · GenAI Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root{
    --bg:#05050f;
    --panel: rgba(20, 20, 38, 0.55);
    --panel-solid:#12121f;
    --border: rgba(255,255,255,0.08);
    --text:#f4f4ff;
    --muted:#8b8bb0;
    --accent1:#7c3aed;
    --accent2:#06b6d4;
    --accent3:#ec4899;
    --danger:#f43f5e;
    --glow: 0 0 24px rgba(124,58,237,0.45);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Space Grotesk', -apple-system, sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    position:relative;
  }

  /* ===== animated blob background ===== */
  .blob{
    position:fixed; border-radius:50%; filter:blur(90px); opacity:0.55; z-index:0;
    animation: float 16s ease-in-out infinite;
  }
  .blob1{ width:520px; height:520px; background:var(--accent1); top:-160px; left:-120px; animation-delay:0s; }
  .blob2{ width:480px; height:480px; background:var(--accent2); bottom:-180px; right:-100px; animation-delay:-5s; }
  .blob3{ width:380px; height:380px; background:var(--accent3); top:40%; left:50%; animation-delay:-10s; opacity:0.35; }
  @keyframes float{
    0%,100%{ transform: translate(0,0) scale(1); }
    33%{ transform: translate(40px,-30px) scale(1.08); }
    66%{ transform: translate(-30px,20px) scale(0.94); }
  }
  .noise-overlay{
    position:fixed; inset:0; z-index:1; pointer-events:none;
    background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0);
    background-size:22px 22px;
  }

  .app{ position:relative; z-index:2; display:flex; height:100vh; }

  /* ===== scrollbars ===== */
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(124,58,237,0.4); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(124,58,237,0.7); }

  /* ===== AUTH OVERLAY ===== */
  .auth-overlay{
    position:fixed; inset:0; z-index:1000;
    background:rgba(5,5,15,0.85); backdrop-filter:blur(6px);
    display:flex; justify-content:center; align-items:center;
  }
  .auth-card{
    width:400px; padding:36px 32px;
    background:var(--panel); backdrop-filter:blur(18px);
    border:1px solid var(--border); border-radius:20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), var(--glow);
    animation: pop-in .5s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop-in{ from{ opacity:0; transform: translateY(16px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
  .auth-logo{
    display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:22px;
  }
  .auth-logo .orb{
    width:34px; height:34px; border-radius:10px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow: var(--glow);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 18px rgba(124,58,237,.5);} 50%{ box-shadow:0 0 32px rgba(6,182,212,.6);} }
  .auth-logo span{ font-weight:700; font-size:1.25rem; letter-spacing:2px; }
  .auth-card h2{
    font-size:1.05rem; font-weight:500; text-align:center; margin-bottom:24px; color:var(--muted);
  }
  .input-group{ margin-bottom:16px; }
  .input-group label{ display:block; font-size:0.75rem; color:var(--muted); margin-bottom:6px; letter-spacing:0.5px; text-transform:uppercase; }
  .input-group input{
    width:100%; padding:12px 14px; background:rgba(255,255,255,0.04);
    border:1px solid var(--border); color:var(--text); border-radius:10px;
    font-family:inherit; font-size:0.95rem; transition:.2s;
  }
  .input-group input:focus{ outline:none; border-color:var(--accent2); box-shadow:0 0 0 3px rgba(6,182,212,0.15); }

  .auth-btn{
    width:100%; padding:13px; border:none; border-radius:10px; font-weight:600; font-size:0.95rem;
    cursor:pointer; margin-top:8px; color:#fff; letter-spacing:0.3px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    transition: transform .15s, box-shadow .15s;
  }
  .auth-btn:hover{ transform:translateY(-1px); box-shadow: var(--glow); }
  .auth-btn:active{ transform:translateY(0); }

  .auth-toggle{ text-align:center; margin-top:18px; font-size:0.82rem; color:var(--muted); cursor:pointer; }
  .auth-toggle span{ color:var(--accent2); font-weight:500; }
  .auth-toggle:hover span{ text-decoration:underline; }

  .toast{
    position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:var(--panel-solid); border:1px solid var(--danger); color:var(--text);
    padding:12px 20px; border-radius:10px; font-size:0.85rem; z-index:2000;
    opacity:0; pointer-events:none; transition:.25s;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ===== SIDEBAR ===== */
  .sidebar{
    width:300px; flex-shrink:0; background:var(--panel); backdrop-filter:blur(18px);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column; padding:20px; gap:16px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .orb{ width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,var(--accent1),var(--accent2)); box-shadow:var(--glow); }
  .brand span{ font-weight:700; letter-spacing:2px; font-size:1.05rem; }

  .user-info{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 12px; background:rgba(255,255,255,0.04); border:1px solid var(--border); border-radius:12px;
  }
  .user-info .who{ display:flex; align-items:center; gap:8px; font-size:0.88rem; color:var(--text); }
  .avatar-dot{ width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,var(--accent3),var(--accent1)); display:flex; align-items:center; justify-content:center; font-size:0.75rem; font-weight:700; }
  .logout-btn{
    background:transparent; color:var(--danger); border:1px solid rgba(244,63,94,0.4);
    padding:5px 10px; border-radius:8px; cursor:pointer; font-size:0.72rem; transition:.2s;
  }
  .logout-btn:hover{ background:rgba(244,63,94,0.12); }

  .new-chat-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    color:#fff; border:none; padding:11px; border-radius:12px; font-weight:600;
    cursor:pointer; font-size:0.88rem; transition:.15s;
  }
  .new-chat-btn:hover{ transform:translateY(-1px); box-shadow:var(--glow); }

  .section-label{ font-size:0.7rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted); margin-top:4px; }

  .history-list{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; min-height:60px; }
  .history-item{
    padding:10px 12px; border-radius:10px; font-size:0.83rem; color:var(--muted);
    cursor:pointer; border:1px solid transparent;
    transition:.15s; display:flex; align-items:center; justify-content:space-between; gap:6px;
  }
  .history-item-title{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .history-item:hover{ background:rgba(255,255,255,0.05); color:var(--text); }
  .history-item.active{
    background:rgba(124,58,237,0.15); border-color:rgba(124,58,237,0.4); color:var(--text);
  }
  .history-delete-btn{
    flex-shrink:0; width:20px; height:20px; border-radius:6px; border:none;
    background:transparent; color:var(--muted); cursor:pointer; font-size:0.85rem;
    display:flex; align-items:center; justify-content:center; opacity:0; transition:.15s;
  }
  .history-item:hover .history-delete-btn{ opacity:1; }
  .history-delete-btn:hover{ background:rgba(244,63,94,0.15); color:var(--danger); }
  .history-empty{ font-size:0.78rem; color:var(--muted); padding:8px 4px; opacity:0.7; }

  .system-prompt-wrap{ display:flex; flex-direction:column; gap:6px; }
  .system-prompt-wrap textarea{
    background:rgba(255,255,255,0.04); color:var(--text); border:1px solid var(--border);
    padding:10px; border-radius:10px; font-family:inherit; font-size:0.8rem; resize:vertical;
  }
  .system-prompt-wrap textarea:focus{ outline:none; border-color:var(--accent2); }

  /* ===== CHAT AREA ===== */
  .chat-container{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .chat-header{
    padding:18px 28px; border-bottom:1px solid var(--border);
    background:rgba(10,10,20,0.4); backdrop-filter:blur(10px);
    display:flex; align-items:center; gap:10px;
  }
  .chat-header .live-dot{ width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 10px #22c55e; animation:blink 2s infinite; }
  @keyframes blink{ 50%{ opacity:0.4; } }
  .chat-header h3{ font-size:1rem; font-weight:600; background:linear-gradient(135deg,#fff,#a5b4fc); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .chat-header .sub{ font-size:0.75rem; color:var(--muted); margin-left:auto; }

  .chat-messages{ flex:1; padding:28px; overflow-y:auto; display:flex; flex-direction:column; gap:18px; }

  .msg-row{ display:flex; gap:10px; max-width:78%; animation: rise .25s ease; }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .msg-row.user{ align-self:flex-end; flex-direction:row-reverse; }
  .msg-row.bot{ align-self:flex-start; }

  .msg-avatar{
    width:32px; height:32px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:0.85rem; font-weight:700;
  }
  .msg-row.user .msg-avatar{ background:linear-gradient(135deg,var(--accent2),#3b82f6); }
  .msg-row.bot .msg-avatar{ background:linear-gradient(135deg,var(--accent1),var(--accent3)); }

  .message{
    padding:13px 17px; border-radius:16px; line-height:1.6; font-size:0.93rem; word-break:break-word;
  }
  .message p{ margin-bottom:8px; }
  .message p:last-child{ margin-bottom:0; }
  .message ul,.message ol{ margin-left:20px; margin-bottom:8px; }
  .message pre{ background:rgba(0,0,0,0.35); padding:10px; border-radius:8px; overflow-x:auto; font-family:'JetBrains Mono', monospace; font-size:0.8rem; margin-bottom:8px; }
  .message code{ font-family:'JetBrains Mono', monospace; font-size:0.85em; }

  .msg-row.user .message{
    background:linear-gradient(135deg,var(--accent2),#3b82f6); color:#fff; border-bottom-right-radius:4px;
  }
  .msg-row.bot .message{
    background:var(--panel-solid); border:1px solid var(--border); color:var(--text); border-bottom-left-radius:4px;
  }

  .typing-dots{ display:flex; gap:4px; padding:4px 0; }
  .typing-dots span{ width:6px; height:6px; border-radius:50%; background:var(--muted); animation:tdot 1.2s infinite ease-in-out; }
  .typing-dots span:nth-child(2){ animation-delay:.15s; }
  .typing-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes tdot{ 0%,60%,100%{ transform:translateY(0); opacity:.4; } 30%{ transform:translateY(-5px); opacity:1; } }

  .chat-input-area{
    padding:18px 28px; display:flex; gap:12px; border-top:1px solid var(--border);
    background:rgba(10,10,20,0.4); backdrop-filter:blur(10px);
  }
  .chat-input-area input{
    flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--border); color:var(--text);
    padding:13px 16px; border-radius:12px; outline:none; font-family:inherit; font-size:0.93rem; transition:.2s;
  }
  .chat-input-area input:focus{ border-color:var(--accent2); box-shadow:0 0 0 3px rgba(6,182,212,0.15); }
  .btn-send{
    background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff; border:none;
    padding:0 26px; border-radius:12px; font-weight:600; cursor:pointer; font-size:0.9rem;
    display:flex; align-items:center; gap:8px; transition:.15s;
  }
  .btn-send:hover{ transform:translateY(-1px); box-shadow:var(--glow); }
  .btn-send:active{ transform:translateY(0); }
  .btn-send:disabled{ opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
</style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
  <div class="noise-overlay"></div>

  <div id="toast" class="toast"></div>

  <div id="authModal" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-logo"><div class="orb"></div><span>NEXUS</span></div>
      <h2 id="authTitle">Login to GenAI Platform</h2>
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="authUsername" placeholder="your_username">
      </div>
      <div class="input-group" id="emailGroup" style="display:none;">
        <label>Email Address</label>
        <input type="email" id="authEmail" placeholder="you@example.com">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="authPassword" placeholder="••••••••">
      </div>
      <button class="auth-btn" id="authSubmitBtn" onclick="handleAuth()">Login</button>
      <div class="auth-toggle" onclick="toggleAuthMode()">
        <span id="authToggleText">Need an account? Sign Up</span>
      </div>
    </div>
  </div>

  <div class="app">
    <div class="sidebar">
      <div class="brand"><div class="orb"></div><span>NEXUS</span></div>

      <div class="user-info">
        <div class="who"><div class="avatar-dot" id="avatarInitial">U</div><span id="displayUsername">User</span></div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>

      <button class="new-chat-btn" onclick="startNewChat()">+ New Chat</button>

      <div class="section-label">History</div>
      <div class="history-list" id="historyList">
        <div class="history-empty">No conversations yet</div>
      </div>

      <div class="system-prompt-wrap">
        <label style="font-size:0.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px;">System Prompt</label>
        <textarea id="systemPrompt" rows="3">You are a helpful and expert AI coding assistant.</textarea>
      </div>
    </div>

    <div class="chat-container">
      <div class="chat-header">
        <div class="live-dot"></div>
        <h3>LangChain + PostgreSQL AI Platform</h3>
        <div class="sub">Groq · llama-3.3-70b</div>
      </div>

      <div class="chat-messages" id="chatBox"></div>

      <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
        <button class="btn-send" id="sendBtn" onclick="sendMessage()">Send ✦</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
